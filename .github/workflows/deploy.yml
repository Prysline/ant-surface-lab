name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check and test source
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Verify the compiled site will be published
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/src/main.js' dist/index.html; then
            echo "::error::Uncompiled source HTML was found. Refusing to publish raw source."
            exit 1
          fi
          grep -Eq 'src="/ant-surface-lab/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/ant-surface-lab/assets/[^"]+\.css"' dist/index.html
          find dist/assets -maxdepth 1 -name '*.js' | grep -q .
          find dist/assets -maxdepth 1 -name '*.css' | grep -q .
          echo "Compiled JS and CSS URLs use the ant-surface-lab project base path."
      - name: Upload compiled dist, not repository root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        name: Publish compiled site
        uses: actions/deploy-pages@v4
